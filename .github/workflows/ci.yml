name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xml:
    name: XML + phyphox validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install xmllint and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils ripgrep

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Ruff
        run: make lint

      - name: Pytest
        run: make test

      - name: Validate XML + phyphox references
        run: make validate

      - name: Check generated experiments are up to date
        run: make check-generated

  arduino:
    name: Arduino compile
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Arduino CLI
        env:
          ARDUINO_CLI_VERSION: "1.4.1"
          ARDUINO_CLI_TAG: "v1.4.1"
          ARDUINO_CLI_SHA256: "683cf2a6b8953e3d632e7e4512c36667839d2073349c4b6d312e4c67592359bd"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/arduino/arduino-cli/releases/download/${ARDUINO_CLI_TAG}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/arduino-cli.tar.gz
          printf '%s  %s\n' "$ARDUINO_CLI_SHA256" /tmp/arduino-cli.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/arduino-cli.tar.gz -C /tmp
          install -m 0755 /tmp/arduino-cli "$HOME/.local/bin/arduino-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Arduino CLI cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            ~/.cache/arduino
          key: arduino-cli-${{ runner.os }}-${{ hashFiles('scripts/compile-arduino.sh') }}

      - name: Compile sketches
        run: make compile

  security:
    name: Security baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install security tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Security baseline
        run: make security
